name: Python build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install ruff
      run: python -m pip install --upgrade pip ruff

    - name: Lint with ruff
      run: ruff check --output-format=github .

    - name: Run examples
      run: |
        for entrypoint in */python-source/main.py; do
          example=$(dirname "$entrypoint")
          echo "::group::$example"
          (cd "$example" && python main.py)
          echo "::endgroup::"
        done
