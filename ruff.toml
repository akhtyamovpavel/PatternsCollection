# Настройка ruff под договорённости этого репозитория.
#
# Репозиторий показывает паттерны на трёх языках сразу, поэтому раскладка files
# повторяет привычную для C++ и Java: один класс на файл, имя файла совпадает с
# именем класса. Отсюда и отключённые правила: они верны для обычного пакета на
# Python и мешают здесь.

target-version = "py310"
line-length = 100

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "FURB"]

ignore = [
    # Имя модуля в CamelCase: файл называется по классу, как в C++ и Java.
    "N999",
    # Комментарии и строки документации написаны по-русски. Кириллические
    # буквы, похожие на латинские, для нас не двусмысленность, а норма.
    "RUF001",
    "RUF002",
    "RUF003",
    # Примеры запускаются прямо из своего каталога, без установки пакета,
    # поэтому путь до соседнего паттерна дописывается перед импортом.
    "E402",
    # Условие в одну строку через тернарный оператор читается хуже развёрнутого
    # if и в учебном коде запрещено: разбор на занятии идёт по строкам.
    "SIM108",
]

[lint.per-file-ignores]
# В __init__.py импорты нужны ради реэкспорта, а не ради использования.
"**/__init__.py" = ["F401"]

[lint.isort]
force-single-line = true
